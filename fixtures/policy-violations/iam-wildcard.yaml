# Policy violation fixture: IAM Role with wildcard Action and Policy with wildcard Resource.
# Expected: iam/no-wildcard-action CRITICAL, iam/no-wildcard-resource CRITICAL.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: iam-wildcard-violations
spec:
  compositeTypeRef:
    apiVersion: aws.example.org/v1alpha1
    kind: XVPCNetwork
  mode: Resources
  resources:
    - name: bad-role
      base:
        apiVersion: iam.aws.crossplane.io/v1beta1
        kind: Role
        spec:
          forProvider:
            assumeRolePolicyDocument: |
              {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ec2.amazonaws.com"},"Action":"*"}]}

    - name: bad-policy
      base:
        apiVersion: iam.aws.crossplane.io/v1beta1
        kind: Policy
        spec:
          forProvider:
            policy: |
              {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}
