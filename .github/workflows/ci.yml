name: CI

on:
  push:
    branches: [main]
    paths:
      - "xptest/**"
  pull_request:
    branches: [main]
    paths:
      - "xptest/**"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd xptest
          pip install -e ".[dev]"

      - name: Ruff check
        run: |
          cd xptest
          ruff check src/ tests/

      - name: Ruff format check
        run: |
          cd xptest
          ruff format --check src/ tests/

      - name: Run tests
        run: |
          cd xptest
          pytest tests/ -v --tb=short
