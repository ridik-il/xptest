# Minimal CRD stub for VPC — for framework testing only.
# Replace with a real CRD file from your provider package.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vpcs.ec2.aws.crossplane.io
spec:
  group: ec2.aws.crossplane.io
  names:
    kind: VPC
    listKind: VPCList
    plural: vpcs
    singular: vpc
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                forProvider:
                  type: object
                  required: [cidrBlock, region]
                  properties:
                    cidrBlock:
                      type: string
                    region:
                      type: string
                    enableDnsSupport:
                      type: boolean
                    enableDnsHostnames:
                      type: boolean
                    tags:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                atProvider:
                  type: object
                  properties:
                    vpcId:
                      type: string
                    defaultRouteTableId:
                      type: string
                    ownerId:
                      type: string
                    state:
                      type: string
