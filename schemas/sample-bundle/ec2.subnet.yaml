# Minimal CRD stub for Subnet — for framework testing only.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: subnets.ec2.aws.crossplane.io
spec:
  group: ec2.aws.crossplane.io
  names:
    kind: Subnet
    listKind: SubnetList
    plural: subnets
    singular: subnet
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                forProvider:
                  type: object
                  required: [cidrBlock, region]
                  properties:
                    cidrBlock:
                      type: string
                    region:
                      type: string
                    availabilityZone:
                      type: string
                    vpcIdRef:
                      type: object
                      properties:
                        name:
                          type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                atProvider:
                  type: object
                  properties:
                    subnetId:
                      type: string
                    availableIpAddressCount:
                      type: integer
                    state:
                      type: string
