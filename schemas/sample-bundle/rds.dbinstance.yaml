# Minimal CRD stub for RDS DBInstance — for framework testing only.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dbinstances.rds.aws.crossplane.io
spec:
  group: rds.aws.crossplane.io
  names:
    kind: DBInstance
    listKind: DBInstanceList
    plural: dbinstances
    singular: dbinstance
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                forProvider:
                  type: object
                  required: [dbInstanceClass, engine, region]
                  properties:
                    dbInstanceClass:
                      type: string
                    engine:
                      type: string
                    engineVersion:
                      type: string
                    region:
                      type: string
                    storageEncrypted:
                      type: boolean
                    publiclyAccessible:
                      type: boolean
                    dbSubnetGroupName:
                      type: string
                    dbSubnetGroupNameRef:
                      type: object
                      properties:
                        name:
                          type: string
                    vpcSecurityGroupIdRefs:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                  oneOf:
                    - required: [dbSubnetGroupName]
                    - required: [dbSubnetGroupNameRef]
            status:
              type: object
              properties:
                atProvider:
                  type: object
                  properties:
                    dbInstanceIdentifier:
                      type: string
                    endpoint:
                      type: object
                      properties:
                        address:
                          type: string
                        port:
                          type: integer
                    dbInstanceStatus:
                      type: string
